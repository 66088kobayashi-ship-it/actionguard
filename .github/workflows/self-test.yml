name: self-test
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ag
        uses: ./
        with:
          path: test/fixtures/next15
          version: local
          fail-on-findings: "false"
      - name: Expect the fixture's 6 findings
        env:
          N: ${{ steps.ag.outputs.findings }}
        run: |
          echo "findings=$N"
          test "$N" = "6"
